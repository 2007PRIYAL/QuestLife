services:
  - type: web
    name: questlife-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: questlife-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://questlife.vercel.app

databases:
  - name: questlife-db
    databaseName: life_rpg
    user: questlife
    plan: free
